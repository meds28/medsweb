<style>
:root{--bg:#fff4d6;--ink:#1a1a1a;--card:#fff;--g:#6fdc9c;--pk:#ff9ecb;--sk:#8fd3ff;--yl:#ffd84d;--or:#ff9f5a;--lv:#c7b3ff;--bad:#ff6b6b;--mut:#5b5b5b;--bn:cubic-bezier(.3,1.6,.5,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;color:var(--ink);background:radial-gradient(#1a1a1a14 1.5px,transparent 2px) 0 0/22px 22px,var(--bg);font:16px/1.5 "Plus Jakarta Sans",system-ui,Arial,sans-serif;font-weight:500}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
#bar{position:fixed;top:0;left:0;right:0;height:6px;background:var(--pk);border-bottom:2px solid var(--ink);transform:scaleX(0);transform-origin:left;z-index:30}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:4px solid var(--ink);z-index:5}
nav .wrap{display:flex;align-items:center;min-height:62px;gap:4px}
.logo{font:400 22px "Lilita One",sans-serif;background:var(--yl);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:2px 14px;transform:rotate(-2deg);cursor:pointer;margin-right:auto}
.logo:hover,.hero h1:hover{animation:wob .45s ease}
.links{display:flex;gap:4px;align-items:center}
.links button,.ham{background:none;border:3px solid transparent;border-radius:99px;color:var(--ink);font:800 14px inherit;font-family:inherit;padding:6px 14px;cursor:pointer;min-height:44px;transition:background .15s}
.links button:hover{background:var(--sk)}.links .on{background:var(--pk);border-color:var(--ink)}.ham{display:none;font-size:22px}
@media(max-width:760px){.ham{display:block}.links{display:none;position:absolute;top:62px;left:0;right:0;background:var(--card);flex-direction:column;align-items:stretch;padding:10px 20px;border-bottom:4px solid var(--ink)}.links.open{display:flex}}
.btn{background:var(--g);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px 22px;font:400 17px "Lilita One",sans-serif;letter-spacing:.03em;box-shadow:4px 4px 0 var(--ink);cursor:pointer;min-height:46px;transition:transform .2s var(--bn),box-shadow .2s var(--bn)}
.btn:hover{transform:translate(-3px,-3px) rotate(-1deg);box-shadow:7px 7px 0 var(--ink)}.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--ink)}.btn.o{background:var(--card)}
table .btn{padding:4px 12px;min-height:38px;box-shadow:2px 2px 0 var(--ink);font-size:15px}
.lnk{background:none;border:0;color:var(--ink);font:400 18px "Lilita One",sans-serif;text-decoration:underline wavy var(--pk);text-underline-offset:6px;text-decoration-thickness:3px;cursor:pointer;min-height:44px}
.cartb{position:relative}.cartb i{position:absolute;top:0;right:0;background:var(--pk);border:2px solid var(--ink);border-radius:99px;font:800 10px/1 inherit;font-family:inherit;padding:3px 6px}
h1,h2{font-family:"Lilita One",Impact,sans-serif;font-weight:400;letter-spacing:.01em}
h1{font-size:clamp(44px,10vw,96px);line-height:.98;margin:.2em 0;text-shadow:4px 4px 0 var(--pk)}h2{font-size:clamp(30px,5.5vw,50px);line-height:1;margin:1.5em 0 .5em;text-shadow:3px 3px 0 var(--sk)}
.c{text-align:center;justify-content:center}.card.c{text-align:left}
.sub{font-size:clamp(17px,2.4vw,21px);max-width:600px;margin:16px auto 24px;font-weight:600}
.hero{padding:48px 0 24px;text-align:center}
.tag{display:inline-block;background:var(--lv);border:3px solid var(--ink);border-radius:99px;box-shadow:3px 3px 0 var(--ink);padding:2px 14px;font:800 13px inherit;font-family:inherit;transform:rotate(-3deg)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ln{display:block;overflow:hidden;padding:0 .1em .12em 0}.ln>span{display:block;transform:translateY(115%);animation:rise .7s var(--bn) forwards}
.ln:nth-child(2)>span{animation-delay:.1s}.ln:nth-child(3)>span{animation-delay:.2s}
mark{background:var(--yl);color:var(--ink);padding:0 .15em;border:3px solid var(--ink);border-radius:14px;text-shadow:none;display:inline-block;transform:rotate(-2deg)}
.mqw{margin:8px 0 56px}.mq{overflow:hidden;border:4px solid var(--ink);border-radius:16px;background:var(--yl);transform:rotate(-1.2deg);box-shadow:4px 4px 0 var(--ink)}
.mq>div{display:flex;width:max-content;animation:mq 26s linear infinite}.mq span{padding:8px 18px;font:400 18px "Lilita One",sans-serif;white-space:nowrap}
.stage{position:relative}.bw{position:absolute;right:-6px;top:-46px;z-index:2}
.burst{width:104px;height:104px;border-radius:50%;background:var(--pk);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-content:center;text-align:center;font:400 20px/1 "Lilita One",sans-serif;transform:rotate(12deg)}.burst b{font-weight:400;font-size:22px}
.ratio{position:relative;aspect-ratio:16/9;background:#111;border:4px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);overflow:hidden}
.ratio iframe,.ov{position:absolute;inset:0;width:100%;height:100%;border:0}.ov{display:grid;place-items:center;color:#ddd;text-align:center;padding:16px}
.mut{color:var(--mut);font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}.grid.big{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:4px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:16px;transition:transform .25s var(--bn),box-shadow .25s var(--bn)}
.grid>.card:hover{transform:translate(-3px,-5px) rotate(-1deg);box-shadow:10px 10px 0 var(--ink)}
.pimg{border:3px solid var(--ink);border-radius:14px;margin-bottom:12px;overflow:hidden;background:var(--yl)}.grid>:nth-child(3n+2) .pimg{background:var(--sk)}.grid>:nth-child(3n) .pimg{background:var(--pk)}
.pimg svg{width:100%;height:140px;transition:transform .3s var(--bn)}.big .pimg svg{height:190px}.card:hover .pimg svg{transform:scale(1.1) rotate(-5deg)}
.price{font:400 20px "Lilita One",sans-serif}.oos{color:#d63b3b;font-weight:800;font-size:13px}
input,select{font:inherit;font-weight:600;font-size:16px;padding:10px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);min-height:46px}input:focus,select:focus{outline:none;box-shadow:4px 4px 0 var(--pk)}
label{font:800 13px inherit;font-family:inherit;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:56px 0;text-align:center}.stats>div{background:var(--card);border:4px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:16px 8px}
.stats>:nth-child(1){background:var(--sk)}.stats>:nth-child(2){background:var(--pk)}.stats>:nth-child(3){background:var(--yl)}.stats .mut{color:var(--ink)}.stats h1{margin:0;text-shadow:3px 3px 0 #fff}
.bubble{position:relative;background:var(--card);border:4px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:18px 22px;font:400 20px/1.3 "Lilita One",sans-serif;text-align:center;margin:20px 0 44px}
.bubble::after{content:"";position:absolute;left:12%;bottom:-16px;width:24px;height:24px;background:var(--card);border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg)}
.banner{background:var(--yl);border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;margin:14px 0}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:2px dashed var(--ink);text-align:left;font-size:15px}.ti svg{width:34px;height:34px;vertical-align:middle}
.st{border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font:800 11px inherit;font-family:inherit;background:var(--g)}.st.x{background:var(--bad)}.st.w{background:var(--yl)}
.qr{width:220px;height:220px;margin:12px auto;border:4px solid var(--ink);border-radius:22px;background:#fff;display:grid;place-items:center;font-weight:800;padding:8px}.qr svg{width:100%;height:100%;display:block}
.ok{width:120px;height:120px;animation:boing .7s var(--bn) both}.ok circle{fill:var(--g);stroke:var(--ink);stroke-width:4}
.ok path{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .5s .35s ease-out forwards}
.party{position:fixed;left:50%;top:36%;z-index:50;pointer-events:none}
.party i{position:absolute;width:13px;height:13px;border:2px solid var(--ink);animation:conf 1.5s cubic-bezier(.1,.7,.3,1) forwards}
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,16px) scale(.9);background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:10px 18px;font-weight:800;font-size:14px;opacity:0;transition:opacity .2s,transform .35s var(--bn);pointer-events:none;z-index:60;max-width:92vw}
#cbar{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,170%);background:var(--g);border:3px solid var(--ink);border-radius:99px;box-shadow:5px 5px 0 var(--ink);padding:12px 24px;font:400 18px "Lilita One",sans-serif;cursor:pointer;z-index:20;transition:transform .45s var(--bn);white-space:nowrap}
#cbar.on{transform:translate(-50%,0)}#cbar b{margin-left:10px;font-weight:400}
footer{border-top:4px solid var(--ink);margin-top:60px;padding:24px 0 100px;font-weight:700;font-size:13px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 18px;scrollbar-width:none}
.chip{flex:none;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:8px 16px;font:800 13px inherit;font-family:inherit;box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-height:44px;transition:transform .2s var(--bn),box-shadow .2s}
.chip:hover{transform:translate(-1px,-2px)}.chip.on{background:var(--g);box-shadow:none;transform:translate(3px,3px)}
.fl{margin:28px 0 12px;font:400 28px "Lilita One",sans-serif;text-shadow:2px 2px 0 var(--lv)}
.tiles{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.tile{text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:160px}

.tile .mut{color:var(--ink);font-weight:800}.tile strong{font:400 28px/1 "Lilita One",sans-serif}.tile .lnkt{margin-top:auto;font-weight:800;font-size:14px}

@keyframes wob{25%{transform:rotate(-2deg) scale(1.03)}75%{transform:rotate(2deg) scale(1.03)}}
@keyframes boing{from{transform:scale(0) rotate(-40deg)}}@keyframes draw{to{stroke-dashoffset:0}}
@keyframes conf{50%{transform:translate(var(--x),var(--y)) rotate(var(--r))}100%{transform:translate(var(--x),calc(var(--y) + 420px)) rotate(calc(var(--r)*1.6));opacity:0}}
.rv{opacity:0;transform:translateY(28px);transition:opacity .5s,transform .5s var(--bn)}.rv.in{opacity:1;transform:none}
.nk .rv{opacity:1;transform:none;transition:none}.pop{animation:pop .35s}

.logo{font:italic 700 26px "Playfair Display",Georgia,serif;letter-spacing:.03em;background:var(--ink);color:var(--yl);box-shadow:3px 3px 0 var(--pk);padding:2px 16px 4px}
.brand{font:italic 700 18px "Playfair Display",Georgia,serif}

.ti img{width:34px;height:34px;object-fit:cover;vertical-align:middle;border-radius:6px}.big .pimg img{height:190px!important}
.s4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.s4 h1{font-size:clamp(26px,5vw,40px)}.stats>:nth-child(4){background:var(--g)}
.admgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:22px}
.bars{display:grid;gap:12px}.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-weight:700;font-size:14px}.bar i{grid-column:1/-1;display:block;height:16px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--bg)}.bar i b{display:block;height:100%;background:var(--g);border-right:3px solid var(--ink)}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px}.chart>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;font-weight:800}.chart b{display:block;width:100%;min-height:4px;background:var(--pk);border:3px solid var(--ink);border-radius:8px 8px 0 0}
.plus{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:21;width:64px;height:64px;border-radius:50%;background:var(--yl);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:400 38px/1 "Lilita One",sans-serif;cursor:pointer;transition:transform .2s var(--bn)}.plus:hover{transform:rotate(90deg) scale(1.08)}.plus:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.modal{position:fixed;inset:0;background:#1a1a1a99;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}.modal .card{width:min(460px,100%);max-height:92vh;overflow:auto}
</style>

${o.st=="w"?`<div class="qr">${qr(PAYURL)}</div><p class="mut" style="margin:0">Scan QR dengan kamera HP untuk membuka halaman Payment sukses. Ini simulasi, bukan QRIS bank.</p><p>Sisa waktu: <strong id="cd"></strong></p>
<div class="row c"><button class="btn" data-act="sim-ok">Simulasikan pembayaran berhasil</button><button class="btn o" data-act="gagal">Simulasikan pembayaran gagal</button><button class="btn o" data-act="cancel">Batalkan</button></div>
<p class="mut">Di versi produksi, status berhasil hanya berubah lewat webhook gateway yang terverifikasi.</p>`
:`${o.st=="b"?`<svg class="ok" viewBox="0 0 100 100" role="img" aria-label="Berhasil"><circle cx="50" cy="50" r="44"/><path d="M28 52l16 16 30-34"/></svg><p><strong>Yeay, pembayaran berhasil!</strong><br>Bukti transaksi tersimpan di Riwayat.</p>`:(o.st=="g"?"<p><strong>Pembayaran gagal.</strong><br>Stok tidak berkurang. Silakan coba lagi.</p>":o.st=="k"?"<p><strong>Waktu pembayaran habis.</strong><br>Stok tidak berkurang.</p>":"<p>Transaksi tidak diselesaikan.</p>")}<button class="btn" data-act="done">Lihat Riwayat</button>`}</div>`},
bayar(){const b=bp;return `<h1>Bayar.</h1><div class="banner">SIMULASI PEMBAYARAN — TIDAK ADA UANG YANG DITRANSFER</div><div class="card c" style="max-width:460px;margin:0 auto;text-align:center"><div>Medsfood · No. pesanan <strong>${esc(b.no)}</strong></div><h2>${rp(b.t)}</h2>${b.done?`<div><svg class="ok" viewBox="0 0 100 100" role="img" aria-label="Berhasil"><circle cx="50" cy="50" r="44"/><path d="M28 52l16 16 30-34"/></svg></div><p><strong>Pembayaran berhasil!</strong></p><div style="margin-top:14px"><button class="btn o" data-act="back">Kembali</button></div>`:`<p class="mut">Cek nomor pesanan dan total, lalu bayar.</p><button class="btn" data-act="paynow">Bayar ${rp(b.t)}</button>`}</div>`},
riwayat(){const l=orders.filter(o=>(!rf.st||o.st==rf.st)&&(!rf.dt||o.t.startsWith(rf.dt))).reverse();
return `<h1>Riwayat.</h1><div class="row noprint"><label>Status<br><select id="rs"><option value="">Semua</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${rf.st==k?"selected":""}>${v}</option>`).join("")}</select></label>
<label>Tanggal<br><input type="date" id="rd" value="${rf.dt}"></label></div><div class="banner">Transaksi berlabel DEMO adalah contoh, bukan transaksi nyata.</div>
${l.length?l.map(o=>`<div class="card" style="margin-bottom:12px"><div class="row"><strong>${o.no}</strong><span class="tag">${o.demo?"DEMO":"SIMULASI"}</span>
<span class="st ${o.st=="b"?"":o.st=="w"?"w":"x"}">${ST[o.st]}</span><span class="mut">${o.t.replace("T"," ")}</span><span class="price">${rp(tot(o.items))}</span>
<button class="btn o noprint" data-open="${o.no}">${open==o.no?"Tutup":"Detail"}</button></div>
${open==o.no?`<table>${o.items.map(([i,q])=>`<tr><td>${pr(i).n}</td><td>${q} × ${rp(pr(i).p)}</td><td>${rp(pr(i).p*q)}</td></tr>`).join("")}</table><p class="mut">Metode: QRIS (simulasi)</p><button class="btn o noprint" onclick="print()">Cetak bukti</button>`:""}</div>`).join(""):`<div class="card c">Tidak ada transaksi yang cocok.</div>`}`}
};
function grid(){const S=STANDS.find(x=>x.id==f.st);let l=P.filter(p=>(!S||S.ids.includes(p.id))&&(f.c=="Semua"||p.c==f.c)&&p.n.toLowerCase().includes(f.q.toLowerCase())&&(!f.ok||p.s>0));
l.sort((a,b)=>f.sort=="murah"?a.p-b.p:f.sort=="mahal"?b.p-a.p:a.n.localeCompare(b.n));
$("#grid").innerHTML=l.length?l.map(pcard).join(""):`<div class="card c">Produk tidak ditemukan. Coba kata kunci atau kategori lain.</div>`;$("#sinfo").textContent=S?`${S.fl} · ${S.n}${S.t?" ("+S.t+")":""} — ${S.d}`:"Semua stand di Lt. Bawah dan Lt. Atas";}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
function go(r,k){cur=r;if(r!="cart"&&pay&&pay.st!="w")pay=null;bar();$("#links").classList.remove("open");$("#app").classList.toggle("nk",!!k);$("#app").innerHTML=V[r]();if(!k)scrollTo(0,0);
 document.querySelectorAll(".links button[data-go]").forEach(b=>b.classList.toggle("on",b.dataset.go==r));
 document.querySelectorAll(".rv").forEach(el=>io.observe(el));
 if(r=="katalog")grid();
 if(r=="home"){document.querySelectorAll("[data-n]").forEach(el=>{const n=+el.dataset.n,t0=performance.now();(function s(t){const k=Math.min((t-t0)/900,1);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)});
  const fr=$("#sf");fr.onload=()=>{const v=$("#vload");v&&v.remove()};setTimeout(()=>{const v=$("#vload");if(v)v.innerHTML=`Model belum dapat dimuat di sini.<br><a style="color:#86efac" target="_blank" rel="noopener" href="https://sketchfab.com/models/702ca030d9e04eeca075bf08c340e153">Buka di Sketchfab</a>`},8000)}
 if(r=="cart"&&pay&&pay.st=="w")tick()}
function tick(){clearInterval(timer);timer=setInterval(()=>{const left=pay.exp-Date.now(),c=$("#cd");
 if(left<=0){clearInterval(timer);pay.st="k";toast("Pembayaran kedaluwarsa");if(cur=="cart")go("cart",1);return}
 if(c)c.textContent=Math.floor(left/60000)+":"+String(Math.floor(left/1000)%60).padStart(2,"0")},500)}
function party(){if(rm)return;const cl=["#ff9ecb","#ffd84d","#6fdc9c","#8fd3ff","#c7b3ff","#ff9f5a"],bx=document.createElement("div");bx.className="party";
 for(let i=0;i<36;i++){const s=document.createElement("i"),a=Math.random()*6.283,d=110+Math.random()*250;s.style.cssText=`background:${cl[i%6]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-110}px;--r:${Math.random()*720-360}deg;border-radius:${i%3?"3px":"50%"}`;bx.append(s)}
 document.body.append(bx);setTimeout(()=>bx.remove(),1700)}
async function login(){const id=$("#as").value,pw=$("#ap").value,e=$("#ae");if(Date.now()<lock){e.textContent="Terlalu banyak percobaan. Coba lagi sebentar.";return}
 let h="";try{h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(id+":"+pw)))].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(x){e.textContent="Browser tidak mendukung verifikasi.";return}
 if(h===HASH[id]){adm=id;fails=0;toast("Selamat datang, admin "+STANDS.find(x=>x.id==id).n);go("admin")}else{if(++fails>=5){lock=Date.now()+3e4;fails=0}e.textContent="Kata sandi salah.";$("#ap").value=""}}
async function saveP(){const cl=x=>x.replace(/[<>&"]/g,"").trim(),n=cl($("#pn").value),pc=Math.round(+$("#pp").value),st=Math.floor(+$("#ps").value);
 if(n.length<2||!(pc>0)||$("#ps").value===""||st<0)return toast("Lengkapi nama, harga, dan stok");
 let im="";const f0=$("#pf").files[0];if(f0){if(f0.size>1e6)return toast("Foto maksimal 1 MB");im=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f0)})}
 const id=Math.max(...P.map(p=>p.id))+1;P.push({id,n,c:$("#pc").value,p:pc,s:st,d:cl($("#pd").value)||"Produk baru.",im});STANDS.find(x=>x.id==adm).ids.push(id);addOpen=false;toast(n+" ditambahkan");go("admin",1)}
function kirim(){const g=id=>$("#"+id).value.trim(),n=g("kn"),m=g("km");if(n.length<2||m.length<10){$("#ke").textContent="Isi nama dan pesan (minimal 10 karakter).";return}
 const t=`Halo operator Medsfood,\nNama: ${n}${g("kk")?" ("+g("kk")+")":""}\nMasalah: ${$("#kj").value}${g("ko")?"\nNo. pesanan: "+g("ko"):""}\n\n${m}`;$("#ke").textContent="";
 if(KONTAK.wa)window.open("https://wa.me/"+KONTAK.wa+"?text="+encodeURIComponent(t),"_blank","noopener");
 else if(KONTAK.email)location.href="mailto:"+KONTAK.email+"?subject="+encodeURIComponent("Kendala Medsfood")+"&body="+encodeURIComponent(t);
 else{navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{});toast("Pesan disalin. Kirim ke operator ya.")}}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.id=="ham")return $("#links").classList.toggle("open");
 if(t.dataset.st){f.st=t.dataset.st;if($("#grid")){$("#chips").innerHTML=chips();grid()}else nav("katalog");return}
 if(t.dataset.go)return nav(t.dataset.go);
 if(t.dataset.add){add(+t.dataset.add);return}
 if(t.dataset.d){const[i,d]=t.dataset.d.split(",").map(Number);add(i,d);return go("cart",1)}
 if(t.dataset.open){open=open==t.dataset.open?null:t.dataset.open;return go("riwayat",1)}
 const a=t.dataset.act;
 if(a=="login")return login();if(a=="logout"){adm=null;addOpen=false;return go("admin")}if(a=="addp"){addOpen=true;return go("admin",1)}if(a=="cancelp"){addOpen=false;return go("admin",1)}if(a=="savep")return saveP();if(a=="kirim")return kirim();
 if(a=="pay"){if(pay&&pay.st=="w")return;const it=Object.entries(cart).map(([i,q])=>[+i,q,src[i]||prim(+i)]);if(!it.length||it.some(([i,q])=>q>pr(i).s))return toast("Periksa stok keranjang");
  pay={no:"MF-"+Date.now().toString(36).toUpperCase(),t:D(0),items:it,st:"w",exp:Date.now()+300000};orders.push(pay);go("cart")}
 if(a=="sim-ok")return settle();
 if(a=="gagal"){clearInterval(timer);pay.st="g";toast("Pembayaran gagal");return go("cart")}
 if(a=="paynow"){bp.done=1;try{localStorage.setItem("mf.paid",bp.no+"|"+Date.now())}catch(e){}if(pay&&pay.no==bp.no&&pay.st=="w")return settle();go("bayar",1);return party()}
 if(a=="back")return go(pay&&pay.st=="w"?"cart":"home");
 if(a=="cancel"){clearInterval(timer);pay.st="d";go("cart")}
 if(a=="done"){pay=null;go("riwayat")}});
document.addEventListener("input",e=>{const i=e.target.id;
 if(i=="q"){f.q=e.target.value;grid()}if(i=="fc"){f.c=e.target.value;grid()}if(i=="fs"){f.sort=e.target.value;grid()}if(i=="fo"){f.ok=e.target.checked;grid()}
 if(i=="agree")$("#payb").disabled=!e.target.checked;
 if(i=="rs"){rf.st=e.target.value;go("riwayat",1)}if(i=="rd"){rf.dt=e.target.value;go("riwayat",1)}});
function bar(){const b=$("#cbar"),n=cnt();b.classList.toggle("on",n>0&&cur!="cart"&&cur!="bayar");if(n)b.innerHTML=`${n} item · ${rp(tot(Object.entries(cart).map(([i,q])=>[+i,q])))} <b>Checkout →</b>`}
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
function fx(){$("#bar").style.transform=`scaleX(${scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)})`}
addEventListener("scroll",()=>requestAnimationFrame(fx),{passive:true});
function nav(r){go(r);fx()}
document.addEventListener("keydown",e=>{if(e.key=="Escape"){$("#links").classList.remove("open");if(addOpen){addOpen=false;if(cur=="admin")go("admin",1)}}if(e.key=="Enter"&&e.target.id=="ap")login();});
document.addEventListener("click",e=>{if(!e.target.closest("nav"))$("#links").classList.remove("open")});
route()||go("home");fx();
</script>
